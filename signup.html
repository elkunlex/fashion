<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up / Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
            <!-- Toggle Buttons -->
            <div class="flex mb-8">
                <button onclick="showSignup()" id="signup-tab"
                    class="w-1/2 py-2 text-center border-b-2 border-black font-bold">Sign Up</button>
                <button onclick="showLogin()" id="login-tab" class="w-1/2 py-2 text-center border-b">Login</button>
            </div>

            <!-- Signup Form -->
            <form id="signup-form" class="space-y-6" onsubmit="handleSignup(event)">
                <div>
                    <label class="block text-gray-700 mb-2" for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" required
                        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-black">
                </div>
                <div>
                    <label class="block text-gray-700 mb-2" for="signup-email">Email</label>
                    <input type="email" id="signup-email" required
                        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-black">
                </div>
                <div>
                    <label class="block text-gray-700 mb-2" for="signup-password">Password</label>
                    <input type="password" id="signup-password" required minlength="6"
                        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-black">
                </div>
                <div>
                    <label class="block text-gray-700 mb-2" for="signup-confirm">Confirm Password</label>
                    <input type="password" id="signup-confirm" required
                        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-black">
                </div>
                <button type="submit" class="w-full bg-black text-white py-2 rounded-lg hover:bg-gray-800">Sign
                    Up</button>
            </form>

            <!-- Login Form -->
            <form id="login-form" class="hidden space-y-6" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-gray-700 mb-2" for="login-email">Email</label>
                    <input type="email" id="login-email" required
                        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-black">
                </div>
                <div>
                    <label class="block text-gray-700 mb-2" for="login-password">Password</label>
                    <input type="password" id="login-password" required
                        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-black">
                </div>
                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input type="checkbox" class="mr-2">
                        <span class="text-sm text-gray-600">Remember me</span>
                    </label>
                    <a href="#" class="text-sm text-black hover:underline">Forgot Password?</a>
                </div>
                <button type="submit"
                    class="w-full bg-black text-white py-2 rounded-lg hover:bg-gray-800">Login</button>
            </form>
        </div>
    </div>

    <script>
        // Toggle between signup and login forms
        function showSignup() {
            document.getElementById('signup-form').classList.remove('hidden');
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('signup-tab').classList.add('border-black', 'font-bold');
            document.getElementById('login-tab').classList.remove('border-black', 'font-bold');
        }

        function showLogin() {
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('signup-form').classList.add('hidden');
            document.getElementById('login-tab').classList.add('border-black', 'font-bold');
            document.getElementById('signup-tab').classList.remove('border-black', 'font-bold');
        }

        // Handle signup submission
        function handleSignup(event) {
            event.preventDefault();

            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('signup-confirm').value;

            // Validate passwords match
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            // Store user data in localStorage
            const users = JSON.parse(localStorage.getItem('users') || '[]');

            // Check if email already exists
            if (users.some(user => user.email === email)) {
                alert('Email already registered!');
                return;
            }

            // Add new user
            users.push({ name, email, password });
            localStorage.setItem('users', JSON.stringify(users));

            alert('Successfully registered! Please login.');
            showLogin();
        }

        // Handle login submission
        function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            // Get users from localStorage
            const users = JSON.parse(localStorage.getItem('users') || '[]');

            // Find user
            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                // Store login status
                localStorage.setItem('currentUser', JSON.stringify(user));
                alert('Successfully logged in!');
                window.location.href = 'index.html'; // Redirect to home page
            } else {
                alert('Invalid email or password!');
            }
        }

        // Check if user is already logged in
        document.addEventListener('DOMContentLoaded', () => {
            const currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                window.location.href = 'index.html'; // Redirect if already logged in
            }
        });
    </script>
</body>

</html>
